<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <title>CodexHost — 在 Codex 里，调度所有编程 Agent</title>
    <meta
      name="description"
      content="保留官方 Codex 体验，也自带轻量桌面与 Web 端。让 Claude Code、Pi、Grok 等 18+ Agent 互相派活、无缝交接，跨电脑和手机随时掌控。"
    />
    <link rel="canonical" href="https://chost.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CodexHost" />
    <meta property="og:url" content="https://chost.dev/" />
    <meta property="og:title" content="CodexHost — 在 Codex 里，调度所有编程 Agent" />
    <meta
      property="og:description"
      content="把 18+ 编程 Agent 聚进同一工作台：互相派活、无损交接，跨电脑和手机随时掌控。"
    />
    <meta property="og:image" content="https://chost.dev/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CodexHost — 在 Codex 里，调度所有编程 Agent" />
    <meta
      name="twitter:description"
      content="把 18+ 编程 Agent 聚进同一工作台：互相派活、无损交接，跨电脑和手机随时掌控。"
    />
    <meta name="twitter:image" content="https://chost.dev/og-image.png" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('codexhost-theme');
          var preferDark =
            saved === 'dark' ||
            (!saved &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (preferDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink antialiased selection:bg-ink selection:text-canvas">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
